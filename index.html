<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#162531"/><link rel="icon" type="image/svg+xml" href="/icon.svg"/><title>loch.js</title></head><body><div id="app"><header id="toolbar">
  <h1><button id="about-button" type="button" aria-label="About loch.js" aria-haspopup="dialog" aria-controls="about-dialog">loch.js</button></h1>
  <nav id="menus" aria-label="Main menu">
    <details class="menu"><summary>File</summary><div class="menu-items"><button id="open" type="button">Open…</button></div></details>
    <details class="menu"><summary>Scene</summary><div class="menu-items">
      <details class="control-group"><summary>Visibility</summary><div class="group-items">
        <label><input id="bounding-box" type="checkbox" checked/> Bounding box</label>
        <label><input id="lines" type="checkbox" checked/> Centreline</label>
        <label><input id="walls" type="checkbox" checked/> Walls</label>
        <label><input id="surface" type="checkbox" checked/> Surface</label>
        <label><input id="indicators" type="checkbox" checked/> Indicators</label>
      </div></details>
      <details class="control-group"><summary>Centreline</summary><div class="group-items">
        <label><input id="centreline-surface" type="checkbox" checked/> Surface</label>
        <label><input id="centreline-underground" type="checkbox" checked/> Underground</label>
        <label>Color <select id="centreline-color" aria-label="Centreline color"><option value="altitude" selected>Altitude</option><option value="default">Default</option></select></label>
        <label><input id="centreline-splay" type="checkbox" checked/> Splay</label>
        <label><input id="centreline-duplicate" type="checkbox" checked/> Duplicate</label>
      </div></details>
      <details class="control-group"><summary>Walls</summary><div class="group-items">
        <label><input id="walls-culling" type="checkbox"/> Culling</label>
        <label><input id="textured-walls" type="checkbox"/> Texture walls</label>
      </div></details>
      <details class="control-group"><summary>Surface</summary><div class="surface-controls">
        <label><input id="surface-image-overlay" type="checkbox" checked/> Image overlay</label>
        <label><input id="surface-transparency" type="checkbox" checked/> Transparency</label>
        <label id="surface-opacity-control" class="surface-opacity" for="surface-opacity">Opacity <output id="surface-opacity-value" for="surface-opacity">50%</output><input id="surface-opacity" type="range" min="0" max="100" step="1" value="50"/></label>
      </div></details>
    </div></details>
    <details class="menu"><summary>View</summary><div class="menu-items">
      <label><input id="walker" type="checkbox"/> Walker</label>
      <label><input id="perspective" type="checkbox" checked/> Perspective</label>
      <label><input id="lock-tilt" type="checkbox"/> Lock tilt</label>
      <hr/>
      <button id="plan" type="button" data-view="plan">Plan</button>
      <button id="profile" type="button" data-view="profile">Profile</button>
    </div></details>
    <details class="menu"><summary>Rendering</summary><div class="menu-items">
      <details class="control-group light-controls"><summary>Light</summary><div class="light-sliders">
        <label class="light-mode" for="light-mode">Mode <select id="light-mode"><option value="static" selected>Static</option><option value="follow">Follow camera</option><hr/><option value="headlight">Headlight</option></select></label>
        <label for="light-bearing">Bearing <output id="light-bearing-value" for="light-bearing">27°</output><input id="light-bearing" type="range" min="0" max="360" step="1" value="27" title="Light from: 0° north, 90° east, 180° south, 270° west"/></label>
        <label for="light-clino">Clino <output id="light-clino-value" for="light-clino">53°</output><input id="light-clino" type="range" min="-90" max="90" step="1" value="53" title="Light from: −90° below, 0° horizontal, +90° above"/></label>
      </div></details>
      <label>Detail <select id="detail" aria-label="Wall detail"><option value="auto">Automatic</option><option value="full" selected>Full detail</option></select></label>
      <hr/>
      <button id="fullscreen" type="button">Full screen</button>
    </div></details>
  </nav>
  <button id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menus" hidden><span class="hamburger" aria-hidden="true"></span></button>
  <button id="walker-toggle" type="button" aria-label="Walker mode" aria-pressed="false" title="Enable Walker mode"><svg viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M5.7 5.5C5.6 3.9 6.4 2.1 7.6 2.1c1.5-.1 3.3.9 4.4 2l3.5-.7c1.2-.2 1.6 1.5.4 1.8l-4.4 1z"/>
    <circle cx="8.8" cy="6.7" r="3.1" fill="currentColor"/>
    <path d="m8.8 10-.3 6.1m.1-5.8-4.2 5m4.7-4.9 4 4 2.4-1.3M8.5 16.1l-1.7 3.3-2 2.6m3.7-5.9 3.1 3.1 1.8 2.6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="rotate(40 16 12)"><rect x="14" y="9.5" width="4" height="5.5" rx=".8" fill="currentColor"/><path d="M16 9.5V6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g>
  </svg></button>
  <input id="file" type="file" accept=".lox" aria-label="Open LOX file" hidden/>
</header><main><canvas id="view" aria-label="3D cave model"></canvas><aside id="model-indicators" class="overlay" aria-label="Model indicators">
  <div id="legend"></div>
  <div class="orientation-indicators">
    <div id="compass-indicator" class="orientation-indicator" role="img" aria-label="Compass">
      <svg viewBox="0 0 68 68" aria-hidden="true"><circle class="indicator-ring" cx="34" cy="34" r="23"/><path class="compass-index" d="m31 1 3 5 3-5z"/>
        <g id="compass-rose"><text class="compass-north" x="34" y="10">N</text><text x="61" y="38">E</text><text x="34" y="65">S</text><text x="7" y="38">W</text><path class="compass-needle-north" d="m34 14-5 20h10z"/><path class="compass-needle-south" d="m34 54-5-20h10z"/></g><circle cx="34" cy="34" r="2" fill="currentColor"/>
      </svg><span id="bearing-value">000°</span>
    </div>
    <div id="tilt-indicator" class="orientation-indicator" role="img" aria-label="View tilt">
      <svg viewBox="0 0 68 68" aria-hidden="true"><circle class="indicator-ring" cx="34" cy="34" r="23"/><path class="tilt-horizon" d="M8 34h52M34 8v5m0 42v5"/><g id="tilt-arrow"><path class="tilt-direction" d="M17 34h31"/><path class="tilt-tip" d="m52 34-9-5v10z"/></g><circle cx="34" cy="34" r="2" fill="currentColor"/></svg><span id="tilt-value">0°</span>
    </div>
  </div>
</aside><aside id="scale-indicator" class="scale-indicator" role="img" aria-label="View scale"><span id="scale-value"></span><div id="scale-ruler" class="scale-ruler"></div></aside></main><footer id="status" role="status">Loading sample cave…</footer></div><dialog id="about-dialog" aria-labelledby="about-title"><h2 id="about-title">About loch.js</h2><dl><dt>Version</dt><dd id="app-version"></dd><dt>Commit</dt><dd><code id="build-commit"></code></dd><dt>Built</dt><dd><time id="build-date"></time></dd></dl><form method="dialog"><button autofocus>Close</button></form></dialog><script type="module" src="/src/main.ts"></script></body></html>
